{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login Page{% endblock %}
{% block content %}
<div class="min-vh-90 d-flex align-items-center justify-content-center mt-5">
  <div class="card shadow-lg rounded-4 border-0" style="max-width: 450px; width: 100%;">
    <div class="card-body p-5">
      <h3 class="text-center mb-4 text-primary fw-bold">Welcome Back</h3>
      <p class="text-center text-muted mb-4">Please log in to your account</p>
      <form method="POST" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex justify-content-center align-items-center mt-3 mb-3">
          <a href="{% url 'password_reset' %}" class="text-decoration-none small text-primary">
            Forgot Password?
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
